[package]
name = "apitap-core"
description = "Blazing-fast database-to-database transfer engine (the apitap core)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Profiling only (benchmarks/profiling.md): zero overhead unless enabled.
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath-alloc"]

[dependencies]
hotpath = { version = "0.22", optional = true }
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "mysql",
    "chrono",
    "runtime-tokio-rustls",
] }
chrono = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Allocator tuning on the read hot path (M_MMAP_THRESHOLD; glibc Linux only).
libc = "0.2"
futures = "0.3"
thiserror = "2"
num_cpus = "1"
# Fast integer/float formatting for the MySQL text lane (binary read → TSV).
itoa = "1"
ryu = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
bytes = "1"
# SigV4 signing for the s3:// sink — all three already compiled via sqlx.
sha2 = "0.10"
# mysql_native_password scramble on the raw MySQL read plane (wire/mywire.rs).
sha1 = "0.10"
hmac = "0.12"
hex = "0.4"
# LOAD DATA LOCAL INFILE streaming for the MySQL sink — sqlx can't do it.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
# Incremental RFC-4180 parsing for the CSV-file sources (GitHub); zero-dep
# push parser, records stream through a bounded buffer.
csv-core = "0.1"
# zlib-rs backend: ~2-4x faster than the default miniz_oxide at the same
# ratio — the gzip leg is the CPU wall on small cores (BigQuery route).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Low-level writer only (no arrow): the BigQuery Parquet lane builds column
# chunks straight from Postgres binary COPY values. snap = SNAPPY pages.
parquet = { version = "54", default-features = false, features = ["snap", "zstd"] }
iceberg = "0.10.0"
uuid = { version = "1.24.0", features = ["v4"] }
async-trait = "0.1.91"
base64 = "0.23.0"
md-5 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
