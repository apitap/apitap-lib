[workspace]
resolver = "2"
members = ["crates/apitap-core", "py-apitap"]

[workspace.package]
version = "0.49.0"
edition = "2021"
# Declared so `cargo build` says which toolchain is too old instead of failing
# somewhere in the middle of a dependency. 1.75 is what the async-fn-in-trait
# use across the Source/Sink traits needs.
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/apitap/apitap-lib"

[profile.release]
# fat LTO was A/B'd 2026-08-07 on the capped CDC lanes and came back
# UNRESOLVABLE on a drifted bench box (pg within-round median −1.1s but
# absolute median +0.6s, one +5.7s round against an outlier-fast base; my
# flat). Reverted to thin; re-test on a freshly reset box before a release
# that wants the maybe-1s. Build time roughly doubles under fat.
lto = "thin"
codegen-units = 1

# Lever #1 (perf research 2026-07-11): sqlx-core with a 512 KiB socket buffer instead
# of the 8 KiB default — see vendor/sqlx-core/src/net/socket/buffered.rs. Same version
# as the lockfile pin; drop this patch when/if sqlx makes the size configurable.
[patch.crates-io]
sqlx-core = { path = "vendor/sqlx-core" }
